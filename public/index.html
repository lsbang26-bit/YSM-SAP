<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#0A2466">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YSM SAP">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>언제까지 엑셀 쓸꺼야...</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: light module tree on the left, sticky header with period + currency controls, KPI strip, chart + breakdown, ledger table */
:root{
  --bg:#F5F6F7; --surface:#FFFFFF; --surface-2:#F7F9FB; --sunken:#EEF1F4; --line:#E5E8EC; --line-strong:#D1D7DE;
  --fg:#1D2D3E; --fg-2:#32465A; --muted:#556B82; --faint:#8396A8;
  --accent:#0070F2; --accent-hover:#0064D9; --accent-soft:#EBF4FF; --accent-line:#B8D8FF; --on-accent:#FFFFFF;
  --good:#256F3A; --good-soft:#EBF5EE; --warn:#C35500; --warn-soft:#FFF3E6; --bad:#AA0808; --bad-soft:#FFEAEA;
  --info:#0064D9; --info-soft:#EBF4FF; --bar:#D5E7FC; --bar-2:#7FB5F5;
  --shadow:0 0 1px rgba(34,53,72,.12),0 1px 4px rgba(34,53,72,.06);
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171C; --surface:#1D232A; --surface-2:#232A32; --sunken:#171C22; --line:#2F3842; --line-strong:#3E4A56;
  --fg:#EAECEE; --fg-2:#C9D1D8; --muted:#A9B4BE; --faint:#7D8994;
  --accent:#4DB1FF; --accent-hover:#7BC4FF; --accent-soft:#16304A; --accent-line:#245079; --on-accent:#0B1620;
  --good:#6AC57D; --good-soft:#163222; --warn:#FF9A4D; --warn-soft:#3A2614; --bad:#FF8888; --bad-soft:#3E1A1A;
  --info:#4DB1FF; --info-soft:#16304A; --bar:#22405F; --bar-2:#3C77B8;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12171C; --surface:#1D232A; --surface-2:#232A32; --sunken:#171C22; --line:#2F3842; --line-strong:#3E4A56;
  --fg:#EAECEE; --fg-2:#C9D1D8; --muted:#A9B4BE; --faint:#7D8994;
  --accent:#4DB1FF; --accent-hover:#7BC4FF; --accent-soft:#16304A; --accent-line:#245079; --on-accent:#0B1620;
  --good:#6AC57D; --good-soft:#163222; --warn:#FF9A4D; --warn-soft:#3A2614; --bad:#FF8888; --bad-soft:#3E1A1A;
  --info:#4DB1FF; --info-soft:#16304A; --bar:#22405F; --bar-2:#3C77B8;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.92em}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}

/* Sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;
  padding:22px 14px 18px;padding-left:max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 20px}
.logo{width:38px;height:34px;border-radius:11px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:10.5px;letter-spacing:.04em}
.brand b{display:block;font-size:14px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:10.5px}
.group{margin-bottom:4px}
.ghead{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:9px 8px;border-radius:9px;text-align:left;color:var(--fg);font-weight:600;font-size:12px}
.ghead:hover{background:var(--surface-2)}
.tog{width:20px;height:20px;border-radius:6px;border:1px solid var(--line-strong);display:grid;place-items:center;font-size:12px;line-height:1;color:var(--muted);flex:none}
.ghead[aria-expanded="true"] .tog{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.ghead .cnt{margin-left:auto;font-size:10.5px;color:var(--faint)}
.ghead.solo{margin-bottom:6px}.ghead.solo .tog{font-size:11px}
.ghead.solo.on{background:var(--accent-soft);color:var(--accent)}.ghead.solo.on .tog{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.kpi[data-kgo],.dash-sec .kpi{cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.kpi[data-kgo]:hover,.dash-sec .kpi:hover{box-shadow:0 6px 18px rgba(15,27,34,.10);transform:translateY(-1px)}
.dtabs{display:flex;padding-top:6px;overflow-x:auto}
table.stk{font-size:11.5px;border-collapse:separate;border-spacing:0}
table.stk th,table.stk td{padding:8px 10px;vertical-align:middle;min-width:76px}
table.stk thead th{text-align:center;line-height:1.3}
table.stk th.grp{border-bottom:1px solid var(--line);font-size:11px;color:var(--fg-2)}
table.stk th.stick{text-align:left}
table.stk .gs{border-left:1px solid var(--line-strong)}
table.stk td.n{text-align:right}
table.stk td.am{color:var(--muted)}
table.stk td.expc{background:var(--surface-2)}
table.stk .cnt{background:var(--accent-soft)}
table.stk .val{background:var(--good-soft)}
table.stk .cell{width:96px;min-width:80px;height:28px}
table.stk .stick{position:sticky;left:0;z-index:2;background:var(--surface);box-shadow:1px 0 0 var(--line-strong);min-width:160px;max-width:200px;white-space:normal}
table.stk thead .stick,table.stk tfoot .stick{background:var(--surface-2)}
table.stk sup{font-size:9px;color:var(--warn);margin-left:2px}
table.stk .mrg{display:inline-block;margin-left:6px;vertical-align:1px;padding:0 6px;border-radius:999px;background:var(--surface);font-size:10px;font-weight:600;color:var(--good)}
table.stk .mrg.neg{color:var(--bad)}
.fxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.fxgrid label{display:grid;gap:4px;font-size:11px;color:var(--muted)}
.fxgrid small{color:var(--faint)}
.fhead{gap:12px 16px}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1;min-width:0}
.fbar .fsel{height:34px;max-width:240px;background:var(--surface);border-radius:10px}
.fbar .btn{height:34px}
.fbar .ftext{width:160px;padding:0 10px}
.frange{display:inline-flex;align-items:center;gap:4px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 8px;font-size:11.5px;color:var(--muted)}
.frange.on{border-color:var(--accent);color:var(--accent)}
.frange input{width:84px;border:0;background:none;height:30px;text-align:right;font-size:12px;color:var(--fg);min-width:0}
.frange .tilde{color:var(--faint)}
.chartzone .btrack i{transition:height .7s cubic-bezier(.22,.8,.24,1)}
.chartzone .ht i{transition:width .7s cubic-bezier(.22,.8,.24,1)}
.chartzone .hb,.chartzone .bv{transition:background .2s,color .2s}
.chartzone{display:grid;gap:18px}
.hbars{display:grid;gap:4px}
.hb{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(60px,1.4fr) auto;gap:12px;align-items:center;width:100%;border:0;background:none;padding:7px 8px;border-radius:8px;text-align:left;color:var(--fg);font-size:12px}
.hb:hover{background:var(--surface-2)}
.hb.on{background:var(--accent-soft)}
.hl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl small{display:block;font-size:10.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis}
.ht{height:10px;border-radius:5px;background:var(--sunken);overflow:hidden}
.ht i{display:block;height:100%;background:var(--bar-2);border-radius:5px}
.hb.on .ht i,.hb:hover .ht i{background:var(--accent)}
.hv{text-align:right;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.hv small{display:block;font-size:10.5px;color:var(--faint);font-weight:400}
@media (max-width:560px){.hb{grid-template-columns:minmax(0,1fr) auto}.ht{grid-column:1/-1;grid-row:2}.fbar .fsel{max-width:100%;flex:1 1 140px}.fbar .range,.frange{width:100%}.frange input{flex:1}}
.items{list-style:none;margin:2px 0 8px;padding:0}
.items button{width:100%;background:none;border:0;text-align:left;color:var(--muted);padding:8px 10px 8px 38px;border-radius:9px;font-size:12px;position:relative}
.items button:hover{color:var(--fg);background:var(--surface-2)}
.items button.on{color:var(--accent);background:var(--accent-soft);font-weight:600}
.items button.on::before{content:"";position:absolute;left:18px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--accent)}
.sidefoot{margin-top:auto;padding:16px 8px 0;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:grid;gap:10px}
.sidefoot button{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:11px;text-align:left;color:var(--fg-2)}
.sidefoot button:hover{border-color:var(--line-strong)}
.sidefoot .row{display:flex;gap:6px;align-items:center}
.sidefoot .row button{flex:1;text-align:center}
.sidefoot .danger{color:var(--bad)}
.fx{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;color:var(--fg-2)}
.fx input{width:76px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:2px 6px;text-align:right}

/* Main */
.main{min-width:0;padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1560px;margin:0 auto;padding-inline:clamp(0px,2vw,16px)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:18px 0 12px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.titlerow{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.hbtns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.burger{display:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;font-size:15.5px}
.crumb{font-size:11.5px;color:var(--muted);margin-bottom:2px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.025em;line-height:1.2;text-wrap:balance}
.desc{color:var(--muted);font-size:12px;margin:4px 0 0}
.saved{font-size:10.5px;color:var(--faint);white-space:nowrap;align-self:flex-end;padding-bottom:3px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--sunken);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-weight:600;font-size:11.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.seglabel{font-size:11px;color:var(--faint);margin-right:-4px}
.pnav{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;overflow:hidden}
.pnav button{border:0;background:none;width:32px;height:32px;font-size:15px;color:var(--muted)}
.pnav button:hover{background:var(--surface-2);color:var(--fg)}
.pnav span{padding:0 10px;font-weight:600;font-size:12px;white-space:nowrap;min-width:170px;text-align:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 14px;height:34px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--fg-2)}
.btn:hover{border-color:var(--line-strong);color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{background:var(--accent-hover)}
.btn.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.spacer{flex:1}
.editbar{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);border-radius:10px;padding:9px 14px;font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:11.5px;font-weight:500;color:var(--fg-2)}
.chip:hover{border-color:var(--line-strong)}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:600}
.chip.yr.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hint{font-size:11px;color:var(--faint)}

.content{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding-top:20px}
.content>*{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;align-content:start;min-width:0;box-shadow:var(--shadow);border-top:3px solid var(--line-strong)}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:8px}
.kpi .l::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--line-strong)}
.kpi.good .l::before{background:var(--good)} .kpi.bad .l::before{background:var(--bad)} .kpi.warn .l::before{background:var(--warn)}
.kpi.good{border-top-color:var(--good)} .kpi.bad{border-top-color:var(--bad)} .kpi.warn{border-top-color:var(--warn)} .kpi{border-top-color:var(--accent)}
.kpi .v{font-size:18px;font-weight:600;letter-spacing:-.025em;line-height:1.15;overflow-wrap:anywhere}
.kpi .s{font-size:10.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .v.txt{font-size:13px;font-weight:600;letter-spacing:0;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px}
.duo.single{grid-template-columns:minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;box-shadow:var(--shadow);overflow:hidden}
.card>header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
.card>header h2{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em}
.card>header .meta{font-size:11px;color:var(--faint)}
.card .body{padding:16px 20px}
.search{margin-left:auto;height:32px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface-2);min-width:0;width:240px;max-width:100%;font-size:12px}

.chart svg{width:100%;height:auto;display:block}
.chart .b{fill:var(--bar)} .chart .b.cur{fill:var(--accent)} .chart .b.b2{fill:var(--bar-2)} .chart .b.neg{fill:var(--bad)}
.chart text{fill:var(--muted);font-size:10.5px;font-family:var(--font)}
.chart text.val{fill:var(--fg);font-weight:600}
.chart line{stroke:var(--line)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-left:auto}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:12px 16px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{font-size:10.5px;color:var(--muted);font-weight:600;background:var(--surface-2);letter-spacing:.01em}
td.n,th.n{text-align:right}
td.w{white-space:normal;min-width:180px}
td.calc{color:var(--fg-2)}
.brand[data-cover]{cursor:pointer}
body.cover-on{overflow:hidden}
.cover{position:fixed;inset:0;z-index:60;overflow:auto;color:#E6F0FF;font-family:var(--font);
  background:radial-gradient(ellipse at 50% 52%,#1652C4 0%,#0C3A9C 30%,#072766 62%,#041A48 100%)}
.cover::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;
  background-image:linear-gradient(rgba(120,190,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(120,190,255,.07) 1px,transparent 1px),radial-gradient(rgba(140,210,255,.18) 1px,transparent 1.5px);
  background-size:48px 48px,48px 48px,24px 24px}
.mm-hud{position:relative;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px clamp(16px,2.4vw,32px) 0}
.mm-clock{display:flex;align-items:baseline;gap:10px}
.mm-clock b{font-size:30px;font-weight:600;letter-spacing:.02em;color:#fff;font-variant-numeric:tabular-nums}
.mm-clock span{font-size:12px;color:#9EC3F5}
.mm-pill{display:flex;align-items:center;gap:8px;border:1px solid rgba(90,220,170,.5);background:rgba(20,80,70,.35);color:#9BF0CF;border-radius:999px;padding:5px 14px;font-size:11.5px;font-weight:600;letter-spacing:.08em}
.mm-pill i{width:7px;height:7px;border-radius:50%;background:#3EE6A4;box-shadow:0 0 8px #3EE6A4;animation:mmBlink 2s ease-in-out infinite}
@keyframes mmBlink{50%{opacity:.35}}
.mm-enter{justify-self:end;white-space:nowrap;flex:none;border:1px solid rgba(255,214,90,.55);background:rgba(255,194,26,.12);color:#FFE07A;border-radius:999px;padding:6px 13px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .2s,box-shadow .2s}
.mm-enter:hover{background:rgba(255,194,26,.22);box-shadow:0 0 18px rgba(255,194,26,.35)}
.mm-panel{position:absolute;z-index:2;top:74px;left:clamp(16px,2.4vw,32px);width:230px;display:grid;gap:2px;padding:10px;border:1px solid rgba(120,190,255,.28);border-radius:12px;background:rgba(8,30,80,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mm-panel button{display:flex;justify-content:space-between;gap:10px;background:none;border:0;border-radius:8px;padding:7px 8px;color:#DCE8FF;font-family:inherit;cursor:pointer;text-align:left}
.mm-panel button:hover{background:rgba(120,190,255,.12)}
.mm-panel span{font-size:11.5px;color:#9EC3F5} .mm-panel b{font-size:12.5px;font-variant-numeric:tabular-nums}
.mm-svg{display:block;width:100%;height:calc(100vh - 62px);min-height:560px;margin-top:-10px}
.mm-svg [data-g]{transition:opacity .25s}
.mm-svg[data-hl] [data-g]{opacity:.2}
.mm-stream{fill:none;stroke:#3FC8FF;stroke-width:1;stroke-opacity:.22;stroke-dasharray:140 520;animation:mmFlow var(--t) linear var(--d) infinite}
.mm-stream.hi{stroke-opacity:.45;stroke-width:1.4}
@keyframes mmFlow{to{stroke-dashoffset:-660}}
.mm-ln{fill:none;stroke:#7FD3FF;stroke-width:1.1;stroke-opacity:.5;stroke-dasharray:1;stroke-dashoffset:1;animation:mmDraw 1s ease-out var(--d) forwards}
.mm-ln.g{stroke:#FFD45A;stroke-opacity:.55;stroke-width:1.5}
@keyframes mmDraw{to{stroke-dashoffset:0}}
.mm-leaf,.mm-grp{opacity:0;animation:mmIn .5s ease-out var(--d) forwards;cursor:pointer;outline:none}
@keyframes mmIn{from{opacity:0}to{opacity:1}}
.mm-leaf text{fill:#fff;font-size:14.5px;font-weight:500;transition:fill .2s;paint-order:stroke;stroke:#0B2E7A;stroke-width:4px;stroke-linejoin:round}
.mm-grp text{paint-order:stroke;stroke:#0B2E7A;stroke-width:5px;stroke-linejoin:round}
.mm-leaf .mm-lring{fill:rgba(10,40,100,.8);stroke:#6CCBFF;stroke-width:1.6;transition:stroke .2s}

<script>
(function(){

/* ---------- utilities ---------- */

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function barsSVG(labels,vals,isMoney,curIdx){
  const mxv=Math.max(...vals.map(v=>Math.max(0,v)),1), f=v=>isMoney?compact(v):nf0.format(v);
  return `<div class="bars" role="img" aria-label="${esc(labels.map((l,i)=>l+' '+f(vals[i])).join(', '))}">${vals.map((v,i)=>{const cur=i===curIdx,h=Math.max(1.5,Math.max(0,v)/mxv*100);
    return `<div class="bcol${cur?' cur':''}" title="${esc(labels[i])}: ${isMoney?plain(v):nf0.format(v)}"><span class="bv">${f(v)}</span><div class="btrack"><i style="height:${h}%"></i></div><span class="bl">${esc(labels[i])}</span></div>`}).join('')}</div>`;
}
function trendHTML(label,fn,isMoney){
  const R=rangeP(),md=R.mode,ae=R.end>TODAY&&R.start<=TODAY?TODAY:R.end,ps=[];for(let i=7;i>=0;i--)ps.push(period(shift(ae,md,-i),md));
  const vals=ps.map(p=>fn(p)||0);
  const prev=vals[6],cur=vals[7],ch=prev?(cur-prev)/prev:NaN;
  return `<div class="card chart"><header><h2>${esc(label)}</h2><span class="meta">${md==='week'?'최근 8주':'최근 8개월'} · ${esc(ae.replace(/-/g,'.'))} 기준</span>
    ${isFinite(ch)?`<span class="meta ${ch>=0?'pos':'neg'}" style="margin-left:auto">전${md==='week'?'주':'월'} 대비 ${ch>=0?'+':''}${(ch*100).toFixed(1)}%</span>`:''}</header>
    <div class="body">${barsSVG(ps.map(p=>p.short),vals,isMoney,7)}</div></div>`;
}

function groupSummary(title,rows,key,metrics,subKey){
  const groups={};rows.forEach(r=>{const g=r[key]||'(미지정)';(groups[g]=groups[g]||[]).push(r)});
  const keys=Object.keys(groups);
  const main=metrics[metrics.length>1&&metrics[1][1]?1:0];
  const val=(m,k)=>m[1]?sumBy(groups[k],m[1]):null;
  keys.sort((a,b)=>(val(main,b)||0)-(val(main,a)||0));
  const mxv=Math.max(1,...keys.map(k=>Math.abs(val(main,k)||0)));
  if(!keys.length)return `<div class="card"><header><h2>${esc(title)}</h2></header><div class="empty">이 기간에 해당 자료가 없습니다.</div></div>`;
  const sub=k=>subKey?`<div style="font-size:11px;color:var(--faint);white-space:normal;margin-top:4px">${esc(uniq(groups[k].map(subKey)).join(', '))}</div>`:'';
  return `<div class="card"><header><h2>${esc(title)}</h2><span class="meta">${keys.length}개 항목</span></header><div class="tw"><table>
    <thead><tr><th>항목</th>${metrics.map(m=>`<th class="n">${esc(m[0])}</th>`).join('')}<th>비중</th></tr></thead><tbody>
    ${keys.map(k=>`<tr><td style="white-space:normal">${TONE[k]!==undefined?pill(k):esc(k)}${sub(k)}</td>${metrics.map(m=>`<td class="n">${m[3]?m[3](groups[k],k):m[2](val(m,k))}</td>`).join('')}
      <td><div class="meter"><i style="width:${Math.max(2,Math.abs(val(main,k)||0)/mxv*100)}%"></i></div></td></tr>`).join('')}
    </tbody></table></div></div>`;
}

function cellView(c,r,p,m){
  if(c.view)return c.view(r);
  let v=c.calc?c.calc(r,p):r[c.k];

  if(c.calc&&v==='')return '<span class="dim">–</span>';
  if(c.cls==='cur')return v==='USD'?'<span class="cur-tag usd">US$</span>':'<span class="dim">MXN</span>';
  if(isMoney(c)){

function bucketPeriods(p){
  const out=[], d0=pd(p.start), d1=pd(p.end);
  if(p.days<=31){for(let d=d0;d<=d1;d=addD(d,1))out.push({start:ds(d),end:ds(d),short:`${d.getMonth()+1}/${d.getDate()}`});return {unit:'일별',ps:out}}
  if(p.days<=120){let s=addD(d0,-((d0.getDay()+6)%7));for(;s<=d1;s=addD(s,7)){const e=addD(s,6);out.push({start:ds(s<d0?d0:s),end:ds(e>d1?d1:e),short:`${s.getMonth()+1}/${s.getDate()}`})}return {unit:'주별',ps:out}}
  for(let m=new Date(d0.getFullYear(),d0.getMonth(),1);m<=d1;m=new Date(m.getFullYear(),m.getMonth()+1,1)){const e=new Date(m.getFullYear(),m.getMonth()+1,0);out.push({start:ds(m<d0?d0:m),end:ds(e>d1?d1:e),short:p.days>366?`${String(m.getFullYear()).slice(2)}.${m.getMonth()+1}`:`${m.getMonth()+1}월`})}
  return {unit:'월별',ps:out};
}

function tableHTML(m,p,modId){

// 경리자료: totals of the filtered rows — 입금, 출금 and 순액 (입금 − 출금), money columns converted to MXN
function splitFoot(m,p,rows,cols){

// 주별 입금 예정: 미수 잔액을 수금기일 주(월~일)로 묶음. 지난 기일은 "연체", 이번 주부터 8주, 그 뒤는 "이후"
function arWeeks(){
  const mon=d=>{const x=pd(d);return ds(addD(x,-((x.getDay()+6)%7)))}, w0=mon(TODAY), B=[{k:'od',l:'연체',s:'',e:addDs(w0,-1)}];
  for(let i=0;i<8;i++){const s=addDs(w0,7*i),e=addDs(s,6),d=pd(s);B.push({k:'w'+i,l:i===0?'이번 주':`${d.getMonth()+1}/${d.getDate()}`,s,e})}
  B.push({k:'later',l:'이후',s:addDs(w0,56),e:''});
  const open=(DB.ar||[]).filter(r=>arBal(r)>0.5);
  B.forEach(b=>{b.rows=open.filter(r=>{const d=validD(r.due)?r.due:r.date;return b.k==='od'?d<w0:b.k==='later'?d>=b.s:d>=b.s&&d<=b.e});b.v=sumBy(b.rows,arBal)});
  return B;
}

  const rows=E.map(e=>({e,a:accrual(e,p.start,p.end),y:payableYTD(e,p.end)}));
  return {rows,t:k=>sumBy(rows,r=>r.a[k]),ty:sumBy(rows,r=>r.y.ag+r.y.vp+r.y.sf)};
}

function persRows(p){
  const F=UI.pf, at=asOf(p);
  return DB.employees.filter(e=>{
    const td=tenureDays(e);
    if(F.dept&&e.dept!==F.dept)return false;
    if(F.st&&empStatusOf(e,at)!==F.st)return false;
    if(F.shift&&e.shift!==F.shift)return false;

// one weekly pay row per employee for every Saturday in the period, skipping rows that already exist
function genPayroll(p){
  let n=0, d=pd(p.start);d=addD(d,(6-d.getDay()+7)%7);
  for(;ds(d)<=p.end;d=addD(d,7)){const s=ds(d), from=ds(addD(d,-6));
    DB.employees.forEach(e=>{const days=overlap(e.hire,e.leave,from,s);if(days<=0||DB.payroll.some(x=>x.emp===e.name&&x.date===s))return;DB.payroll.unshift(mkPay(e,s,from,days));n++})}
  return n;
}

function loadPdfJs(){

  return new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=PDFJS+'pdf.min.js';sc.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';ok(window.pdfjsLib)}catch(e){no(e)}};sc.onerror=no;document.head.appendChild(sc)});

// PDF text → lines of cells (cells split where the horizontal gap is wide), so the same parsers work for PDF and Excel
async function pdfLines(buf){

  for(let i=1;i<=doc.numPages;i++){
    const pg=await doc.getPage(i), tc=await pg.getTextContent(), rows={};
    tc.items.forEach(it=>{const t=(it.str||'').trim();if(!t)return;const y=Math.round(it.transform[5]/3)*3;(rows[y]=rows[y]||[]).push({x:it.transform[4],w:it.width||0,s:t})});
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{const cells=[];let last=null;
      rows[y].sort((a,b)=>a.x-b.x).forEach(t=>{if(last&&t.x-(last.x+last.w)<6){last.s+=' '+t.s;last.w=t.x+t.w-last.x}else{last={x:t.x,w:t.w,s:t.s};cells.push(last)}});
      out.push(cells.map(c=>c.s))});
  }

}

function rayaTable(aoa){

  const di=head.findIndex(h=>/^(depto|departamento|depart)/i.test(h)), rows=[];let dept='';

// layout 2: Contpaq printed lista de raya — one block per employee with concept/amount pairs, grouped under department headings
function rayaBlocks(lines){
  const rows=[], keys=new Set(), seen=new Set();let cur=null, dept='';
  const close=()=>{if(cur){const r=rayaRow(k=>cur.v[k]||0,cur.code,cur.name,cur.dept);if(r)rows.push(r)}cur=null};
  const NUM=/-?\$?\s?\d{1,3}(?:,\d{3})*(?:\.\d{1,4})|-?\$?\s?\d+\.\d{1,4}|^-?\d+$/;

    if(dm&&!/total/i.test(t)){close();dept=dm[1].trim();return}
    if(/total\s+(del\s+)?(depto|departamento|general|empresa|n[oó]mina)/i.test(t)){close();return}
    const cm=t.match(/c[oó]d(?:igo)?\.?\s*:?\s*([A-Za-z0-9-]+)/i), nm=t.match(/nombre\s*:?\s*([A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑa-záéíóúñ ,.]{4,}?)(?=\s{2,}|\s+(?:rfc|curp|nss|imss|puesto|depto|sd|sdi|fecha|$)|$)/i);
    const lead=t.match(/^\s*([A-Z]?\d{1,6})\s+([A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑ ,.]{6,}?)(?=\s{2,}|\s+[A-Z]{4}\d{6}|\s+\d|$)/);
    const known=!cm&&!nm&&!lead&&DB.employees.find(e=>{const et=normName(e.name).split(' ');const tt=normName(t).split(' ');return et.length>1&&et.every(w=>tt.includes(w))});
    if(nm||lead||known){const name=(nm?nm[1]:lead?lead[2]:known.name).replace(/[ ,.]+$/,'').trim(), code=cm?cm[1]:lead?lead[1]:(known?known.no:'');
      if(!/^(total|percep|deduc)/i.test(name)){close();cur={code,name,dept,v:{}};}}

    // concept/amount pairs on this line, e.g. "P001 Sueldo  8,700.00   D001 I.S.R.  1,500.00"

}

const ES_STOP=new Set(['EL','LA','LOS','LAS','Y','E','EN','PARA','POR','CON','AL','A','UN','UNA','SIN']);
const noAcc=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
const titleCase=t=>t.toLowerCase().replace(/(^|[\s.-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
function esKo(src){
  let t=noAcc(src).replace(/\s+/g,' ').trim();if(!t||/[가-힣]/.test(src))return src;
  let corp=false;ES_PHRASE.forEach(([re,ko])=>{t=t.replace(new RegExp('(^|[\\s,])'+re+'(?=$|[\\s,.)])','g'),(m,a)=>{if(ko==='#CORP'){corp=true;return a}return a+'\u0001'+ko+'\u0002'})});
  t=t.replace(/[,]+/g,' ').replace(/\s+/g,' ').trim();
  const segs=t.split(/ (?:DE LA|DE LOS|DE LAS|DEL|DE) /), tailN=[];let hit=0,name='';
  const out=segs.map((seg,si)=>{
    const tok=seg.match(/\u0001[^\u0002]*\u0002|\S+/g)||[];
    const tr=tok.filter(w=>!ES_STOP.has(w)).map(w=>{if(w[0]==='\u0001'){hit++;return w.slice(1,-1)}const k=ES_WORD[w.replace(/[^A-Z]/g,'')];if(k){hit++;return k}return null});
    // trailing run of unknown words in the last segment is a person or brand name, kept as written
    if(si===segs.length-1){let j=tr.length;while(j>0&&tr[j-1]===null&&/^[A-Z]{2,}$/.test(tok.filter(w=>!ES_STOP.has(w))[j-1]))j--;
      if(j>0&&tr.length-j>=2){name=titleCase(tok.filter(w=>!ES_STOP.has(w)).slice(j).join(' '));tr.length=j}}
    const kept=tok.filter(w=>!ES_STOP.has(w));
    // words go into Korean order (modifier first); dates and numbers stay at the end in their own order
    const MON=/^\d{1,2}월$/, words=[];
    tr.forEach((k,i)=>{const w=kept[i];if(/\d/.test(w)||(k&&MON.test(k)))tailN.push(k||w);else words.push(k||(w.length<=4?w:titleCase(w)))});
    return words.reverse().join(' ');
  }).filter(Boolean);
  if(!hit)return src;
  const MON=/^\d{1,2}월$/, tl=tailN.length>1&&MON.test(tailN[0])&&/^\d{4}$/.test(tailN[1])?[tailN[1]+'년 '+tailN[0]].concat(tailN.slice(2)):tailN;
  return (corp?'(주) ':'')+out.reverse().concat(tl).join(' ').replace(/\s+/g,' ').trim()+(name?` (${name})`:'');
}

function mrpYear(y){
  const fc=DB.forecast.filter(r=>validD(r.date)&&+r.date.slice(0,4)===y), cm=y<THIS_YEAR?12:y>THIS_YEAR?0:TODAY_D.getMonth();
  const P=uniq(fc.map(r=>r.product)).map(pr=>{const dem=zeros();fc.filter(r=>r.product===pr).forEach(r=>dem[+r.date.slice(5,7)-1]+=+r.qty||0);
    let st=onHand(pr,'제품');const stk=st, need=dem.map((d,i)=>{if(i<cm)return d;const n=Math.max(0,d-st);st=Math.max(0,st-d);return n});
    return {pr,dem,need,stk,bom:DB.bom.filter(b=>b.product===pr).length}});
  const mats={};
  P.forEach(x=>DB.bom.filter(b=>b.product===x.pr).forEach(b=>{const m=mats[b.material]||(mats[b.material]={mat:b.material,kind:b.kind,unit:b.unit,cur:b.cur,price:+b.price||0,req:zeros(),used:[]});x.need.forEach((n,i)=>m.req[i]+=n*(+b.qty||0));m.used.push(x.pr)}));
  const M=Object.values(mats).map(m=>{let st=onHand(m.mat,m.kind);const stk=st, short=m.req.map((r,i)=>{if(i<cm)return 0;const s2=Math.max(0,r-st);st=Math.max(0,st-r);return s2});
    const lastIn=DB.inbound.filter(r=>r.item===m.mat).sort((a,b)=>a.date<b.date?1:-1)[0], mt=MATERIALS.find(x=>x.n===m.mat);
    return Object.assign(m,{stk,short,amt:short.map(s3=>s3*m.price*rate(m.cur)),vendor:lastIn?lastIn.vendor:(mt?mt.sup:'')})}).sort((a,b)=>a.mat.localeCompare(b.mat));
  return {fc,P,M,cm};
}
const selSum=(a,ms)=>ms.reduce((t,m)=>t+a[m-1],0);
function mrpCalc(p){
  const y=+p.end.slice(0,4), Y=mrpYear(y), ms=p.months||Array.from({length:12},(_,i)=>i+1).filter(m=>{const a=`${y}-${pad(m)}-01`,b=monthEnd(a);return b>=p.start&&a<=p.end});
  const P=Y.P.map(x=>({pr:x.pr,dem:selSum(x.dem,ms),need:selSum(x.need,ms),stk:x.stk,bom:x.bom}));
  const M=Y.M.map(m=>Object.assign({},m,{gross:selSum(m.req,ms),short:selSum(m.short,ms),amt:selSum(m.amt,ms)})).sort((a,b)=>b.amt-a.amt);
  return {fc:Y.fc,P,M,Y,ms};
}

  </div>`;
}

function formFields(m,r,pre){
  return m.cols.filter(c=>!c.calc).map(c=>{
    const sec=c.sec?`<div class="fsec">${esc(c.sec)}</div>`:'';
    const v=r[c.k]??'', a=`id="${pre}-${c.k}" name="${c.k}" data-fk="${c.k}"`;
    let inp;
    if(c.t==='sel'){let opts=c.optsOf?c.optsOf(r):c.opts;if(v&&!opts.includes(v))opts=[v,...opts];inp=`<select ${a}>${opts.map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('')}</select>`}
    else if(c.t==='date')inp=`<input type="date" ${a} value="${esc(v)}"${c.opt?'':' required'}>`;
    else if(isNum(c))inp=`<input type="number" step="any" inputmode="decimal" ${a} value="${+v===0?'':esc(v)}" placeholder="0">`;
    else inp=`<input type="text" ${a} value="${esc(v)}"${c.sug?` list="dl-${c.sug}"`:''}${c.k==='name'?' required':''}>`;
    const vc=c.k==='iva'&&m.cols.some(x=>x.k==='sub')?`<div class="vatcalc" data-vatcalc aria-live="polite">${vatCalcHTML(+r.sub||0,v,r.cur)}</div>`:'';
    return `${sec}<label class="${c.wide?'wide':''}">${esc(c.l)}${inp}</label>${vc}`}).join('');
}
function readForm(form,m){

const consSel=()=>{const all=DB.entities||[];if(!Array.isArray(UI.cons))UI.cons=all.map(e=>e.id);return all.filter(e=>e.role==='지배기업'||UI.cons.includes(e.id))};
function entIS(e,P){
  if(e.role==='지배기업'){const I=P.map(income);return {sales:sumBy(I,'sales'),cogs:sumBy(I,'cogs'),sga:sumBy(I,'sga'),nonop:sumBy(I,x=>x.finInc-x.finExp),tax:sumBy(P,p=>citCalc(p).isr)}}
  const rows=(DB.entfs||[]).filter(r=>r.entity===e.name&&P.some(p=>inP(r,p))), f=k=>sumBy(rows,M(k));
  return {sales:f('sales'),cogs:f('cogs'),sga:f('sga'),nonop:f('nonop'),tax:f('tax')};
}
function entBS(e,end,subs){
  if(e.role==='지배기업'){const b=balance(end);return {cash:b.cashBal,ar:b.ar+b.vatRec,inv:b.inv,fixed:b.fixed,invest:sumBy(subs,s=>+s.invest||0),gw:0,ap:b.ap,loans:b.loans,othl:b.accr+b.vatLiab+b.citLiab,capital:0}}
  const r=(DB.entfs||[]).filter(x=>x.entity===e.name&&x.date<=end).sort((a,b)=>a.date<b.date?1:-1)[0]||{}, f=k=>mx(r,k);
  return {cash:f('cash'),ar:f('ar'),inv:f('inv'),fixed:f('fixed'),invest:0,gw:0,ap:f('ap'),loans:f('loans'),othl:f('othl'),capital:f('capital')};
}
function derive(x){
  x.gross=x.sales-x.cogs;x.op=x.gross-x.sga;x.pre=x.op+x.nonop;x.ni=x.pre-x.tax;
  x.assets=x.cash+x.ar+x.inv+x.fixed+x.invest+x.gw;x.liab=x.ap+x.loans+x.othl;x.equity=x.assets-x.liab;return x;
}
const KEYS=['sales','cogs','sga','nonop','tax','cash','ar','inv','fixed','invest','gw','ap','loans','othl'];
function consolidate(P){
  const ents=consSel(), subs=ents.filter(e=>e.role==='종속기업'), end=minS(P[P.length-1].end,TODAY);
  const cols=ents.map(e=>({e,v:derive(Object.assign({},entIS(e,P),entBS(e,end,subs)))}));
  const sum=derive(Object.fromEntries(KEYS.map(k=>[k,sumBy(cols,c=>c.v[k])])));
  const names=ents.map(e=>e.name);
  const ic=(DB.ic||[]).filter(r=>r.seller!==r.buyer&&names.includes(r.seller)&&names.includes(r.buyer));
  const icSales=sumBy(ic.filter(r=>P.some(p=>inP(r,p))),M('amount')), icBal=sumBy(ic.filter(r=>r.date<=end),r=>mx(r,'amount')-mx(r,'settled'));
  let gw=0, capOwn=0;
  const subInfo=cols.filter(c=>c.e.role==='종속기업').map(c=>{const own=Math.min(100,Math.max(0,+c.e.own||0))/100, co=own*c.v.capital;capOwn+=co;gw+=Math.max(0,(+c.e.invest||0)-co);
    return {name:c.e.name,own,nciEq:(1-own)*c.v.equity,nciNI:(1-own)*c.v.ni,invest:+c.e.invest||0,capOwn:co}});
  const adj={sales:-icSales,cogs:-icSales,sga:0,nonop:0,tax:0,cash:0,ar:-icBal,inv:0,fixed:0,invest:-sum.invest,gw,ap:-icBal,loans:0,othl:0};
  const cons=derive(Object.fromEntries(KEYS.map(k=>[k,sum[k]+adj[k]])));
  const nciEq=sumBy(subInfo,'nciEq'), nciNI=sumBy(subInfo,'nciNI');
  cons.nciEq=nciEq;cons.ownEq=cons.equity-nciEq;cons.nciNI=nciNI;cons.ownNI=cons.ni-nciNI;
  const adjD=derive(Object.fromEntries(KEYS.map(k=>[k,adj[k]])));adjD.equity=cons.equity-sum.equity;
  return {cols,sum,adj:adjD,cons,icSales,icBal,gw,capOwn,subInfo,end,ic};
}

/* ---------- 재고조사: monthly roll-forward per item ---------- */
// 원/부자재: 전월재고 + 당월입고 (원/부자재 입고현황) − 당월사용 (생산 실적 × BOM) = 예상재고; 완제품: 전월재고 + 당월생산 − 당월출고
// 전월재고 = the count entered for the previous month (if none, the previous month's expected stock, marked 예상)
function stockItems(){
  const mats={};MATERIALS.forEach(m=>mats[m.n]={kind:m.kind,unit:m.unit});
  DB.bom.forEach(b=>{if(!mats[b.material])mats[b.material]={kind:b.kind||'원자재',unit:b.unit||'EA'}});

let imp=null;
const normH=s=>String(s??'').replace(/\s|\(.*?\)/g,'').toLowerCase();
function convCell(c,v){
  if(c.t==='date'){
    if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));return {v:`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`}}

  }
  if(isNum(c)){const n=typeof v==='number'?v:parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isFinite(n)?{v:n}:{err:1}}
  if(c.t==='sel'){
    const t=String(v).trim();
    if(c.pct&&typeof v==='number'){const x=v<=1?v*100:v;return {v:Math.round(x)+'%'}}
    if(c.pct&&/면세|exento/i.test(t))return {v:'면세'};
    if(c.cls==='cur')return /us|usd|달러/i.test(t)?{v:'USD'}:/mx|peso|페소/i.test(t)?{v:'MXN'}:{err:1};

}
function parseImport(file,id){

/* ---------- AI 실행엔진: a rotating 3D particle sphere inside HUD rings, drawn on canvas. It mirrors the assistant's state:
   idle → slow spin, listening → brighter with ripples, thinking (a command just ran) → fast swirl, speaking → the sphere pulses ---------- */
const ENG={raf:0,pts:null,last:0,rot:0,think:0,rip:[],lastRip:0};
function engPts(){if(ENG.pts)return ENG.pts;const R=rng(2026),P=[],N=900,ga=Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<N;i++){let x,y,z;if(i<640){const yy=1-(i+.5)/640*2,r=Math.sqrt(1-yy*yy),th=ga*i;x=Math.cos(th)*r;y=yy;z=Math.sin(th)*r;const k=.9+R()*.12;x*=k;y*=k;z*=k}
    else{const u=R()*2-1,th=R()*Math.PI*2,r=Math.cbrt(R())*.88,q=Math.sqrt(1-u*u);x=r*q*Math.cos(th);y=r*u;z=r*q*Math.sin(th)}
    P.push([x,y,z,R(),R()])}
  return ENG.pts=P}
function engState(){return ENG.busy?'think':voice.speaking?'speak':voice.awake?'listen':voice.on?'on':'idle'}
function engPing(){ENG.think=1}
function engStop(){cancelAnimationFrame(ENG.raf);ENG.raf=0}
function engStart(){engStop();engPts();ENG.last=performance.now();
  const reduce=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})();
  const loop=now=>{const cvs=[...document.querySelectorAll('#cover .eng-cv')].filter(c=>c.offsetParent!==null||c.getClientRects().length);
    if(!coverOn()){ENG.raf=0;return}
    const dt=Math.min(.05,(now-ENG.last)/1000);ENG.last=now;const st=engState();
    ENG.think=ENG.busy?1:Math.max(0,ENG.think-dt*.9);
    ENG.rot+=dt*(reduce?.05:(.22+(st==='listen'?.18:0)+(st==='speak'?.25:0)+ENG.think*2.2));
    if((st==='listen'||st==='speak')&&now-ENG.lastRip>(st==='speak'?520:1100)){ENG.rip.push(now);ENG.lastRip=now}
    ENG.rip=ENG.rip.filter(t=>now-t<1600);
    cvs.forEach(c=>engDraw(c,now/1000,st));
    ENG.raf=requestAnimationFrame(loop)};
  ENG.raf=requestAnimationFrame(loop)}
function engDraw(c,t,st){
  const b=c.getBoundingClientRect();if(!b.width)return;const dpr=Math.min(2,window.devicePixelRatio||1),W=Math.round(b.width*dpr),H=Math.round(b.height*dpr);
  if(c.width!==W||c.height!==H){c.width=W;c.height=H}
  const x=c.getContext('2d'),cx=W/2,cy=H/2,S=Math.min(W,H)/2,R0=S*.44,TAU=Math.PI*2;
  const talk=st==='speak'?.045*(Math.sin(t*17)*.6+Math.sin(t*29+1)*.4):0, R=R0*(1+talk+ENG.think*.03), lit=st==='idle'?.8:st==='on'?.9:1;
  x.clearRect(0,0,W,H);x.save();
  // halo + sphere body
  let g=x.createRadialGradient(cx,cy,R*.2,cx,cy,S);g.addColorStop(0,'rgba(70,160,255,.42)');g.addColorStop(.45,'rgba(40,120,240,.18)');g.addColorStop(1,'rgba(20,80,200,0)');
  x.fillStyle=g;x.beginPath();x.arc(cx,cy,S,0,TAU);x.fill();
  g=x.createRadialGradient(cx-R*.25,cy-R*.3,R*.05,cx,cy,R*1.02);g.addColorStop(0,'rgba(120,200,255,.42)');g.addColorStop(.6,'rgba(40,110,230,.28)');g.addColorStop(1,'rgba(30,90,210,.12)');
  x.fillStyle=g;x.beginPath();x.arc(cx,cy,R*1.02,0,TAU);x.fill();
  // particles
  const ay=ENG.rot,ax=.38+Math.sin(t*.3)*.08,ca=Math.cos(ay),sa=Math.sin(ay),cb=Math.cos(ax),sb=Math.sin(ax),dot=S/240;
  x.globalCompositeOperation='lighter';
  for(const p of ENG.pts){const tw=.85+.15*Math.sin(t*3+p[3]*20);
    let X=p[0]*ca+p[2]*sa,Z=-p[0]*sa+p[2]*ca,Y=p[1]*cb-Z*sb;Z=p[1]*sb+Z*cb;
    const d=(Z+1)/2,a=(.12+.88*d*d)*lit*tw,r=(.55+1.5*d)*dot*(p[4]>.93?1.8:1);
    x.fillStyle=p[4]>.82?`rgba(150,225,255,${a.toFixed(3)})`:`rgba(235,248,255,${a.toFixed(3)})`;
    x.beginPath();x.arc(cx+X*R,cy+Y*R,r,0,TAU);x.fill()}
  g=x.createRadialGradient(cx,cy,0,cx,cy,R*.55);g.addColorStop(0,`rgba(220,245,255,${(.18+ENG.think*.25+(st==='speak'?.12:0)).toFixed(3)})`);g.addColorStop(1,'rgba(220,245,255,0)');
  x.fillStyle=g;x.beginPath();x.arc(cx,cy,R*.55,0,TAU);x.fill();
  x.globalCompositeOperation='source-over';
  // ripples while listening / speaking
  const now=performance.now();ENG.rip.forEach(t0=>{const k=(now-t0)/1600;x.strokeStyle=`rgba(${st==='speak'?'255,215,90':'120,230,255'},${(.55*(1-k)).toFixed(3)})`;x.lineWidth=1.5*dot;x.beginPath();x.arc(cx,cy,R*(1.08+k*.55),0,TAU);x.stroke()});
  // thin bright ring
  x.shadowColor='rgba(140,220,255,.9)';x.shadowBlur=10*dot;x.strokeStyle=`rgba(215,240,255,${(.75*lit).toFixed(3)})`;x.lineWidth=1.6*dot;x.beginPath();x.arc(cx,cy,R*1.08,0,TAU);x.stroke();
  // gold arcs
  const gr=ENG.rot*.6;x.shadowColor='rgba(255,200,40,.95)';x.shadowBlur=(14+ENG.think*14)*dot;x.strokeStyle=st==='listen'?'#FFE58A':'#FFD23F';x.lineWidth=(st==='listen'?3.4:2.6)*dot;x.lineCap='round';
  x.beginPath();x.arc(cx,cy,R*1.18,gr+.35,gr+.35+TAU*.62);x.stroke();
  x.lineWidth=1.6*dot;x.beginPath();x.arc(cx,cy,R*1.18,gr+.35+TAU*.68,gr+.35+TAU*.93);x.stroke();
  x.shadowBlur=0;
  // tick ring
  const tr=-ENG.rot*.35;x.strokeStyle='rgba(160,215,255,.6)';x.lineWidth=1*dot;x.beginPath();
  for(let i=0;i<120;i++){const a=tr+i*TAU/120,l=i%10===0?R*.09:i%5===0?R*.055:R*.03,r1=R*1.31;x.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);x.lineTo(cx+Math.cos(a)*(r1+l),cy+Math.sin(a)*(r1+l))}
  x.stroke();
  x.strokeStyle='rgba(160,215,255,.28)';x.beginPath();x.arc(cx,cy,R*1.29,0,TAU);x.stroke();
  // markers pointing inward
  x.fillStyle='rgba(220,240,255,.85)';
  for(let i=0;i<8;i++){const a=tr*1.2+i*TAU/8+TAU/16,r1=R*1.47,ux=Math.cos(a),uy=Math.sin(a),px=-uy,py=ux,s=R*.035;
    x.beginPath();x.moveTo(cx+ux*(r1-s*1.4),cy+uy*(r1-s*1.4));x.lineTo(cx+ux*r1+px*s,cy+uy*r1+py*s);x.lineTo(cx+ux*r1-px*s,cy+uy*r1-py*s);x.closePath();x.fill()}
  // outer dashed ring + small gold segment
  x.setLineDash([2*dot,7*dot]);x.strokeStyle='rgba(140,200,255,.38)';x.lineWidth=1*dot;x.beginPath();x.arc(cx,cy,R*1.58,ENG.rot*.15,ENG.rot*.15+TAU);x.stroke();x.setLineDash([]);
  x.strokeStyle='rgba(255,210,63,.75)';x.lineWidth=2*dot;x.beginPath();x.arc(cx,cy,R*1.58,-ENG.rot*.25+2.2,-ENG.rot*.25+2.75);x.stroke();
  x.restore()}

function searchIndex(){

async function askAI(text){

    let pinned=false,opened=null,msg=null;
    for(let i=0;i<5;i++){
      msg=await aiCall();
      AI.hist.push({role:'assistant',content:msg.content});
      if(msg.stop_reason==='refusal'){AI.hist=[];break}
      if(msg.stop_reason!=='tool_use')break;
      const results=msg.content.filter(b=>b.type==='tool_use').map(b=>{let out='done';
        try{if(b.name==='show_data'){const q=String(b.input&&b.input.query||'자료 띄어줘');pinned=q;out='자료 패널을 띄웠습니다: '+q}

        return {type:'tool_result',tool_use_id:b.id,content:out}});
      AI.hist.push({role:'user',content:results});
    }
    const say=msg&&msg.stop_reason==='refusal'?S('죄송해요, 그 요청에는 답할 수 없어요','Sorry, I can’t help with that','Lo siento, no puedo ayudar con eso')

    AI.busy=false;ENG.busy=false;voiceUI();

  base.forEach(g=>{const o=LAY.iorder[g.id];if(Array.isArray(o)){const known=o.filter(i=>g.items.includes(i));g.items=known.concat(g.items.filter(i=>!known.includes(i)))}});

}
function layAct(a){
  const s=edit.sel;
  if(a==='done'){edit.on=false;edit.sel=null;edit.resetAsk=false;render();layPanel();toast('편집 내용을 저장했습니다');return}
  if(a==='desel'){edit.sel=null;layMarkSel();layPanel();return}
  if(a==='up'||a==='down'){layMove(a==='up'?-1:1);return}
  if(a==='undo'||a==='redo'){const from=a==='undo'?edit.hist:edit.fut,to=a==='undo'?edit.fut:edit.hist;if(!from.length)return;to.push(JSON.stringify(LAY));LAY=Object.assign(layBlank(),JSON.parse(from.pop()));layCommit(true);layPanel();return}
  if(a==='resetask'){edit.resetAsk=true;layPanel();return}
  if(a==='resetno'){edit.resetAsk=false;layPanel();return}
  if(a==='resetyes'){layPush();LAY=layBlank();edit.resetAsk=false;edit.sel=null;layCommit(true);layPanel();toast('화면 편집 내용을 처음 상태로 되돌렸습니다');return}
  if(a.startsWith('scope:')){edit.scope=a.slice(6);layPanel();return}
  if(a.startsWith('fw:')){layStyle({fw:a.slice(3)});return}
  if(a==='it'){const st=LAY.style[layScopeKey(s.key)]||{};layStyle({it:!st.it});return}
  if(a.startsWith('c:')){layStyle({c:a.slice(2)});return}
  if(a==='parent'){const b=layFind(s)&&layFind(s).closest('[data-lb]');if(b){edit.sel={kind:'blk',key:b.dataset.lb};layMarkSel();layPanel()}return}
  if(a==='hide'){layPush();const k=s.kind==='nav'?'nav|'+s.id:UI.mod+'|'+s.key;if(LAY.hide[k])delete LAY.hide[k];else LAY.hide[k]=1;layCommit(s.kind==='nav');layPanel();return}
  if(a==='blkreset'){layPush();delete LAY.blocks[UI.mod];Object.keys(LAY.hide).forEach(k=>{if(k.startsWith(UI.mod+'|'))delete LAY.hide[k]});layCommit();layPanel();return}
  if(a==='clear'){layPush();
    if(s.kind==='nav')delete LAY.names[s.id];
    else if(s.kind==='grp')delete LAY.gnames[s.id];
    else if(s.kind==='txt'){const el=layFind(s);if(el&&el.tagName==='H1')delete LAY.names[UI.mod];['text','style'].forEach(t=>{delete LAY[t][UI.mod+'|'+s.key];delete LAY[t]['*|'+s.key]})}
    layCommit(true);layPanel();return}
}
function layToggle(){edit.on=!edit.on;edit.sel=null;edit.resetAsk=false;closeSide();render();layPanel()}
// 편집 중에는 화면의 버튼·링크가 동작하지 않고 누른 요소가 선택됩니다
window.addEventListener('click',e=>{
  const lb=e.target.closest('[data-layedit]');
  if(lb&&!e.target.closest('#layHost')){e.preventDefault();e.stopPropagation();layToggle();return}
  if(!edit.on)return;
  const pb=e.target.closest('#layHost button[data-lay]');
  if(pb){e.preventDefault();e.stopPropagation();layAct(pb.dataset.lay);return}
  if(e.target.closest('#layHost'))return;
  if(e.target.closest('#burger'))return;
  if(e.target.closest('#main,#nav')){e.preventDefault();e.stopPropagation();laySelect(e.target)}
},true);
window.addEventListener('submit',e=>{if(edit.on&&e.target.closest('#main')){e.preventDefault();e.stopPropagation()}},true);
document.addEventListener('focusin',e=>{if(e.target.id==='layText')layPush()});
document.addEventListener('input',e=>{
  if(e.target.id==='layText'){layText(e.target.value);laySave();layMarkSel();return}
  if(e.target.id==='layColor'){const st=LAY.style[layScopeKey(edit.sel.key)]||{};if(!edit._cp){layPush();edit._cp=1}const k=layScopeKey(edit.sel.key);LAY.style[k]=Object.assign({},st,{c:e.target.value});laySave();renderMain();return}
  if(e.target.dataset.layscale){LAY.scale=+e.target.value;laySave();layApplyGroups();const sp=e.target.previousElementSibling;if(sp)sp.textContent=`전체 화면 크기 · ${LAY.scale}%`}
},true);
document.addEventListener('change',e=>{
  if(e.target.id==='laySize'){layStyle({fs:e.target.value?+e.target.value:''});return}
  if(e.target.id==='layColor'){edit._cp=0;layPanel();return}
  if(e.target.dataset&&e.target.dataset.layscale){layPush()}
},true);
// 끌어서 옮기기: 같은 묶음 안에서 블록, 같은 대분류 안에서 메뉴, 대분류끼리
let layDrag=null;
const dragKind=el=>el.dataset.lnav?'nav':el.dataset.lgroup?'grp':el.dataset.lb?'blk':null;
document.addEventListener('dragstart',e=>{if(!edit.on)return;const el=e.target.closest&&e.target.closest('[data-lnav],[data-lgroup],[data-lb]');if(!el)return;
  layDrag={el,kind:dragKind(el)};el.classList.add('lay-dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','')}catch(x){}});
function dropTarget(e){if(!layDrag)return null;const t=e.target.closest&&e.target.closest(layDrag.kind==='nav'?'[data-lnav]':layDrag.kind==='grp'?'[data-lgroup]':'[data-lb]');
  if(!t||t===layDrag.el)return null;
  if(layDrag.kind==='nav'&&groupOf(t.dataset.lnav)!==groupOf(layDrag.el.dataset.lnav))return null;
  if(layDrag.kind==='blk'&&t.parentNode!==layDrag.el.parentNode)return null;return t}
document.addEventListener('dragover',e=>{const t=dropTarget(e);document.querySelectorAll('.lay-drop').forEach(x=>x!==t&&x.classList.remove('lay-drop'));if(t){e.preventDefault();t.classList.add('lay-drop')}});
document.addEventListener('dragend',()=>{document.querySelectorAll('.lay-drop,.lay-dragging').forEach(x=>x.classList.remove('lay-drop','lay-dragging'));layDrag=null});
document.addEventListener('drop',e=>{const t=dropTarget(e);if(!t)return;e.preventDefault();const d=layDrag;layPush();
  if(d.kind==='nav'){const g=groupOf(t.dataset.lnav),a=g.items.filter(i=>i!==d.el.dataset.lnav);a.splice(a.indexOf(t.dataset.lnav)+(g.items.indexOf(d.el.dataset.lnav)<g.items.indexOf(t.dataset.lnav)?1:0),0,d.el.dataset.lnav);LAY.iorder[g.id]=a;edit.sel={kind:'nav',id:d.el.dataset.lnav}}
  else if(d.kind==='grp'){const ids=GROUPS.map(g=>g.id),from=ids.indexOf(d.el.dataset.lgroup),to=ids.indexOf(t.dataset.lgroup);ids.splice(from,1);ids.splice(to,0,d.el.dataset.lgroup);LAY.gorder=ids;edit.sel={kind:'grp',id:d.el.dataset.lgroup}}
  else{const sib=[...t.parentNode.children].filter(x=>x.dataset.lb).map(x=>x.dataset.lb),k=d.el.dataset.lb,from=sib.indexOf(k),to=sib.indexOf(t.dataset.lb);sib.splice(from,1);sib.splice(to,0,k);layBlockOrder(sib);edit.sel={kind:'blk',key:k}}
  layDrag=null;layCommit(d.kind!=='blk');layPanel()});
layApplyGroups();
// a new month-end appears in the 월말 환율 list with the current rate until it is corrected
(function(){DB.fxHist=DB.fxHist||[];let add=0;for(let k=1;k<=12;k++){const d=ds(new Date(THIS_YEAR,TODAY_D.getMonth()-k+1,0));if(!DB.fxHist.some(h=>h.date===d)){DB.fxHist.push({date:d,rate:FX()});add++}}if(add)save()})();

seedTaxPays();
DB.cash.forEach(r=>{if(!r.bank)r.bank=bankFor(r.cur)});
render();
showCover();
const cv=$('#cover');
cv.addEventListener('mouseover',e=>{const n=e.target.closest('[data-g]'),sv=cv.querySelector('.mm-svg');if(sv){if(n&&n.closest('.mm-svg'))sv.dataset.hl=n.dataset.g;else delete sv.dataset.hl}});
cv.addEventListener('keydown',e=>{if(e.target.id==='aiKeyIn'&&e.key==='Enter'){e.preventDefault();aiSaveKey(e.target.value);if(AI.key)aiTest()}});
cv.addEventListener('input',e=>{if(e.target.id==='mmQ')searchShow(e.target.value)});
cv.addEventListener('keydown',e=>{if(e.target.id==='mmQ'){if(e.key==='Enter'){e.preventDefault();const v=e.target.value.trim();$('#mmRes').hidden=true;if(v){runCmd(v);e.target.value='';if(isPhone())engCmd(false)}}if(e.key==='Escape'){engCmd(false)}return}});
// typing anywhere on the cover opens the engine's command line; clicking elsewhere with it empty closes it
document.addEventListener('keydown',e=>{if(!coverOn()||e.ctrlKey||e.metaKey||e.altKey)return;const tg=e.target;if(tg&&(tg.closest('input,textarea,select,[contenteditable]')))return;
  if(e.key==='Escape'){ansClose();engCmd(false);return}
  if((e.key.length===1&&e.key!==' ')||e.key==='Process'){const w=$('#engCmd');if(w&&w.hidden)engCmd(true);else if(w)$('#mmQ').focus()}});
cv.addEventListener('focusout',e=>{if(e.target.id==='mmQ')setTimeout(()=>{const q=$('#mmQ');if(q&&!q.value&&document.activeElement!==q&&!(document.activeElement||{closest(){}}).closest('.eng-cmd'))engCmd(false)},200)});
cv.addEventListener('keydown',e=>{if(e.target.closest('[data-eng]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();engTap();return}const n=e.target.closest('[data-cgo]');if(n&&(e.key==='Enter'||e.key===' ')&&n.tagName!=='BUTTON'){e.preventDefault();hideCover();go(n.dataset.cgo)}});
document.querySelector('.brand').addEventListener('keydown',e=>{if(e.key==='Enter')showCover()});
})();
</script>
